name: CI Checks

on:
  pull_request:
  merge_group:

jobs:
  ci-checks:
    strategy:
      fail-fast: false
      matrix:
        ha-version: ["2025.5.0", "latest"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r custom_components/playnite_connect/requirements-dev.txt
      - name: Install minimum supported Home Assistant
        if: matrix.ha-version == '2025.5.0'
        run: pip install homeassistant==2025.5.0
      - name: Lint with flake8
        run: |
          flake8 .
      - name: Check code formatting with black
        run: |
          black --check .
      - name: Security analysis with bandit
        run: |
          bandit -r custom_components
      - name: Run integration tests
        run: |
          pytest --cov=custom_components/playnite_connect --cov-report=term-missing tests
